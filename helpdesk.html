<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="description" content="Help Desk Form">
  <meta name="keywords" content="HTML, Form, Help Desk">
  <meta name="author" content="Swinburne University Help Desk">
  <title>CWA Help Desk Appointment</title>
</head>
<body>
    <header>
        <a href="https://www.swinburne.edu.au/">
            <img src="logo.png" alt="Swinburne University" width="150" height="75">
        </a>
    </header>
    <h1>CWA Help Desk Appointment</h1>
    <p>The Help Desk is located in ATC620, Open 10:30 to 19:00 Monday to Friday<br><br>
    Check Blackboard for when CWA tutors will be here.</p>

    <form method="post" action="https://mercury.swin.edu.au/it000000/formtest.php">
        <fieldset>
            <legend>Student Details</legend>
            <p>
                <label for="StudentID">Student ID:</label>
                <input type="text" name="student_id" id="StudentID" 
                pattern="[0-9]\d{7,10}" required>
            </p>
            <p>
                <label for="GivenName">Given Name:</label>
                <input type="text" name="given_name" id="GivenName" maxlength="15" pattern="[a-zA-Z\s]" required>

                <label for="FamilyName">Family Name:</label>
                <input type="text" name="family_name" id="FamilyName" maxlength="15" pattern="[a-zA-Z\s]" required>
            </p>
        </fieldset>

        <fieldset>
            <legend>Your unit</legend>
            <p>
                <label for="COS10011">COS10011</label>
                <input type="radio" name="unit" id="COS10011" value="COS10011" required="required">
                <label for="COS60004">COS60004</label>
                <input type="radio" name="unit" id="COS60004" value="COS60004">
                <label for="COS60007">COS60007</label>
                <input type="radio" name="unit" id="COS60007" value="COS60007"> 
            </p>
            <p><label for="tutor">Your Tutor</label>
                <select name="tutor" id="tutor" required>
                    <option value="">Please Select</option>
                    <option value="Dr. Smith">Dr. Smith</option>
                    <option value="Prof. Johnson">Prof. Johnson</option>
                </select>
            </p>
        </fieldset>

        <fieldset>
            <legend>Issue</legend>
            <p>
            <label for="html">HTML </label>
            <input type="checkbox" name="things[]" id="html" value="html" checked="checked">

            <label for="CSS">CSS </label>
            <input type="checkbox" name="things[]" id="CSS" value="css">

            <label for="JavaScript">JavaScript </label>
            <input type="checkbox" name="things[]" id="JavaScript" value="javascript">

            <label for="PHP">PHP </label>
            <input type="checkbox" name="things[]" id="PHP" value="php">

            <label for="MySQL">MySQL </label>
            <input type="checkbox" name="things[]" id="MySQL" value="mysql">
            </p>

            <p>
            <label for="description">Description of Issue</label><br>
			<textarea id="description" name="description" placeholder="Write description of your problem here..." rows="4" cols="40"></textarea>
		    </p>
        </fieldset>

        <fieldset>
            <legend>Preferred Date/Time</legend>
            
            <label for ="date">Date</label>
            <input type="text" id="date" name="date" placeholder="dd/mm/yyyy" pattern="\d{2}/\d{2}/\d{4}">
            <br>
            <label for="time">Time</label>
            <input type="text" id="time" name="time" placeholder="00:00" pattern="\d{2}:\d{2}">
            
        </fieldset>
    </form>
        <input type= "submit" value="Register">
	    <input type= "reset" value="Reset Form">
</body>
</html>
